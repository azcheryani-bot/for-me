name: Update Relay Configs

on:
  schedule:
    - cron: '0 */6 * * *' # هر ۶ ساعت یکبار
  workflow_dispatch: # امکان اجرای دستی

permissions:
  contents: write

jobs:
  run-relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies & Sing-Box
        run: |
          pip install telethon requests
          # دانلود آخرین نسخه سینگ‌باکس برای لینوکس
          curl -Lo sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.9.0/sing-box-1.9.0-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/
          sing-box version

      - name: Run Script
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
        run: python relay_builder.py

      - name: Commit and Push Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add valid_relays.txt
          git diff-index --quiet HEAD || git commit -m "Update active relay list [skip ci]"
          git push origin main
