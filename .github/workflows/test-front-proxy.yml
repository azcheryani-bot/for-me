name: Test Front Proxy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-front-proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install sing-box
        run: |
          curl -Lo sing-box.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.9.0/sing-box-1.9.0-linux-amd64.tar.gz
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/
          sing-box version

      - name: TCP reachability
        run: |
          python3 -c "import socket; s=socket.create_connection(('185.233.131.236', 443), timeout=10); print('TCP_OK'); s.close()"

      - name: Test vless front proxy through sing-box
        env:
          FRONT_PROXY_VLESS: ${{ secrets.FRONT_PROXY_VLESS }}
        run: |
          python3 test_front_proxy.py
